# Somente Docker local. O site é acessado em http://localhost:8080 (porta do host), e o WordPress
# usa esse mesmo endereço para chamar a si mesmo (WP-Cron, fila de envio do MailPoet). Dentro do
# container nada ouvia na 8080, então essas chamadas falhavam; aqui o Apache também ouve na 8080.
Listen 8080

<VirtualHost *:8080>
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
