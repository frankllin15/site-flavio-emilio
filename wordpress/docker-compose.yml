name: flavio-emilio-wp

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WP_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
      # Usado somente pelo mu-plugin de desenvolvimento (docker/dev-mailpit.php)
      FEC_DEV_SMTP_HOST: mailpit
      FEC_DEV_SMTP_PORT: "1025"
    volumes: &wp-volumes
      - wp_data:/var/www/html
      - ./wp-content/themes/flavio-emilio:/var/www/html/wp-content/themes/flavio-emilio
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/dev-mailpit.php:/var/www/html/wp-content/mu-plugins/dev-mailpit.php:ro
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # WP-CLI: `docker compose run --rm wpcli wp <comando>`
  wpcli:
    image: wordpress:cli-${WP_CLI_PHP}
    profiles: ["tools"]
    user: "33:33" # mesmo www-data da imagem apache, evita problema de permissão
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/flavio-emilio:/var/www/html/wp-content/themes/flavio-emilio
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/dev-mailpit.php:/var/www/html/wp-content/mu-plugins/dev-mailpit.php:ro
      - ./bin:/scripts:ro
      - ./seed:/seed:ro
      - ../public/images:/seed-images:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT}:8025"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  wp_data:
