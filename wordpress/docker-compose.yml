name: flavio-emilio-wp

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:${WP_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        // Acesso pelo Cloudflare Tunnel (npm run share): ver docker/share.php
        require '/usr/local/etc/fec-share.php';
      # Lidos por fec-core/mail.php (em produção, viram constantes no wp-config.php)
      FEC_SMTP_HOST: mailpit
      FEC_SMTP_PORT: "1025"
      FEC_MAIL_FROM: ${FEC_MAIL_FROM}
      FEC_MAIL_FROM_NAME: ${WP_TITLE}
      FEC_TURNSTILE_SITEKEY: ${FEC_TURNSTILE_SITEKEY}
      FEC_TURNSTILE_SECRET: ${FEC_TURNSTILE_SECRET}
      # Libera os envios do MailPoet no Docker (tudo cai no Mailpit). Nunca defina fora do local.
      FEC_DEV_ALLOW_NEWSLETTER: "1"
      # Endereço local, trocado pelo do túnel na saída das páginas (docker/share.php)
      FEC_LOCAL_URL: ${WP_URL}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/flavio-emilio:/var/www/html/wp-content/themes/flavio-emilio
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/apache-loopback.conf:/etc/apache2/sites-enabled/001-loopback.conf:ro
      - ./docker/share.php:/usr/local/etc/fec-share.php:ro

  # WP-CLI: `docker compose run --rm wpcli wp <comando>`
  wpcli:
    image: wordpress:cli-${WP_CLI_PHP}
    profiles: ["tools"]
    user: "33:33" # mesmo www-data da imagem apache, evita problema de permissão
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      WP_URL: ${WP_URL}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/flavio-emilio:/var/www/html/wp-content/themes/flavio-emilio
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/share.php:/usr/local/etc/fec-share.php:ro
      - ./bin:/scripts:ro
      - ./seed:/seed:ro
      - ../public/images:/seed-images:ro

  # Gera seed/generated/og-image.jpg: `npm run og` (usa o Imagick completo da imagem do Apache)
  og-image:
    image: wordpress:${WP_IMAGE_TAG}
    profiles: ["tools"]
    entrypoint: ["php", "/scripts/og-image.php"]
    volumes:
      - ./bin:/scripts:ro
      - ./seed:/seed
      - ../public/images:/seed-images:ro
      - ./wp-content/themes/flavio-emilio/assets/fonts:/fonts:ro

  # Link público temporário (https://<aleatório>.trycloudflare.com) para o site local: `npm run share`
  tunnel:
    image: cloudflare/cloudflared:2025.2.0
    profiles: ["share"]
    depends_on: [wordpress]
    command: ["tunnel", "--no-autoupdate", "--url", "http://wordpress:80"]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT}:8025"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  wp_data:
